# Apache (requiere mod_proxy, mod_proxy_http y mod_headers). Ajuste ServerName y certificados.
<VirtualHost *:443>
    ServerName atalaya.SU-DOMINIO
    # SSLEngine on / SSLCertificateFile ... / SSLCertificateKeyFile ...
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    SetEnvIf Request_URI "^/api/stream" no-gzip=1 dont-vary=1
    ProxyPass        /api/stream http://127.0.0.1:3950/api/stream flushpackets=on timeout=3600
    ProxyPassReverse /api/stream http://127.0.0.1:3950/api/stream
    ProxyPass        / http://127.0.0.1:3950/
    ProxyPassReverse / http://127.0.0.1:3950/
</VirtualHost>
