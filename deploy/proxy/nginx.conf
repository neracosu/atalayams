# Nginx: agregue este server (o solo los location) y ajuste server_name y certificados.
server {
    listen 443 ssl http2;
    server_name atalaya.SU-DOMINIO;
    # ssl_certificate ...; ssl_certificate_key ...;

    location /api/stream {                      # tiempo real (SSE): sin buffer ni compresion
        proxy_pass http://127.0.0.1:3950;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3950;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
